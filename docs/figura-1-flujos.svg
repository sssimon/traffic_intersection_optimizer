<svg viewBox="0 0 800 980" xmlns="http://www.w3.org/2000/svg" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ah-ink" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0a0a0a"/>
    </marker>
    <marker id="ah-ox" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#8a0f1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="980" fill="#fafafa"/>

  <!-- title -->
  <text x="400" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0a0a0a">Figura 1 — Flujos de demanda</text>
  <text x="400" y="70" text-anchor="middle" font-size="12" fill="#7a7a7a" letter-spacing="2">CRUCE AV. PRINCIPAL × CALLE 5 · HORA PICO 07:30–08:30 · veh/h</text>
  <line x1="300" y1="84" x2="500" y2="84" stroke="#8a0f1c" stroke-width="2"/>

  <!-- roads -->
  <rect x="320" y="124" width="160" height="716" fill="#ececec"/>
  <rect x="40" y="400" width="720" height="160" fill="#ececec"/>

  <!-- centerlines -->
  <g stroke="#b9b9b9" stroke-width="2" stroke-dasharray="11 9">
    <line x1="400" y1="124" x2="400" y2="400"/>
    <line x1="400" y1="560" x2="400" y2="840"/>
    <line x1="40" y1="480" x2="320" y2="480"/>
    <line x1="480" y1="480" x2="760" y2="480"/>
  </g>

  <!-- intersection box -->
  <rect x="320" y="400" width="160" height="160" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>

  <!-- stop lines -->
  <g stroke="#0a0a0a" stroke-width="5">
    <line x1="320" y1="400" x2="400" y2="400"/>
    <line x1="400" y1="560" x2="480" y2="560"/>
    <line x1="480" y1="400" x2="480" y2="480"/>
    <line x1="320" y1="480" x2="320" y2="560"/>
  </g>

  <!-- approach names -->
  <g text-anchor="middle" fill="#0a0a0a">
    <text x="400" y="112" font-size="16" font-weight="700">NORTE</text>
    <text x="400" y="862" font-size="16" font-weight="700">SUR</text>
    <text x="690" y="386" font-size="16" font-weight="700">ESTE</text>
    <text x="110" y="588" font-size="16" font-weight="700">OESTE</text>
  </g>
  <g text-anchor="middle" fill="#8a0f1c" font-size="11" font-weight="600" letter-spacing="1">
    <text x="400" y="128">908 veh/h</text>
    <text x="400" y="846">848 veh/h</text>
    <text x="690" y="402">1 373 veh/h</text>
    <text x="110" y="572">1 288 veh/h</text>
  </g>

  <!-- flow arrows: through = ink, left = oxblood -->
  <g fill="none" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M350,170 L350,396"             stroke="#0a0a0a" marker-end="url(#ah-ink)"/>
    <path d="M383,170 L383,434 L450,434"    stroke="#8a0f1c" marker-end="url(#ah-ox)"/>
    <path d="M450,810 L450,564"             stroke="#0a0a0a" marker-end="url(#ah-ink)"/>
    <path d="M417,810 L417,526 L350,526"    stroke="#8a0f1c" marker-end="url(#ah-ox)"/>
    <path d="M730,430 L484,430"             stroke="#0a0a0a" marker-end="url(#ah-ink)"/>
    <path d="M730,463 L454,463 L454,528"    stroke="#8a0f1c" marker-end="url(#ah-ox)"/>
    <path d="M70,530 L316,530"              stroke="#0a0a0a" marker-end="url(#ah-ink)"/>
    <path d="M70,497 L346,497 L346,432"     stroke="#8a0f1c" marker-end="url(#ah-ox)"/>
  </g>

  <!-- volume chips: id (top) + volume (bottom). through ink, left oxblood -->
  <g font-family="'Inter Tight',Arial,sans-serif">
    <!-- NORTE -->
    <g transform="translate(400,212)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#0a0a0a"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#0a0a0a">N-T · DIRECTO</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">735</text>
    </g>
    <g transform="translate(400,300)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#8a0f1c"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8a0f1c">N-L · IZQ.</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#8a0f1c">173</text>
    </g>
    <!-- SUR -->
    <g transform="translate(400,668)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#0a0a0a"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#0a0a0a">S-T · DIRECTO</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">694</text>
    </g>
    <g transform="translate(400,754)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#8a0f1c"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8a0f1c">S-L · IZQ.</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#8a0f1c">154</text>
    </g>
    <!-- ESTE -->
    <g transform="translate(610,438)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#0a0a0a"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#0a0a0a">E-T · DIRECTO</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">1 125</text>
    </g>
    <g transform="translate(610,520)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#8a0f1c"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8a0f1c">E-L · IZQ.</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#8a0f1c">248</text>
    </g>
    <!-- OESTE -->
    <g transform="translate(190,520)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#0a0a0a"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#0a0a0a">W-T · DIRECTO</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">1 066</text>
    </g>
    <g transform="translate(190,438)">
      <rect x="-42" y="-23" width="84" height="46" rx="3" fill="#ffffff" stroke="#8a0f1c"/>
      <text x="0" y="-5" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="1.5" fill="#8a0f1c">W-L · IZQ.</text>
      <text x="0" y="15" text-anchor="middle" font-size="17" font-weight="700" fill="#8a0f1c">222</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(0,908)">
    <line x1="40" y1="-16" x2="760" y2="-16" stroke="#d4d4d4" stroke-width="1"/>
    <line x1="64" y1="8" x2="104" y2="8" stroke="#0a0a0a" stroke-width="7" marker-end="url(#ah-ink)"/>
    <text x="116" y="13" font-size="13" fill="#0a0a0a">Movimiento directo (T)</text>
    <line x1="320" y1="8" x2="360" y2="8" stroke="#8a0f1c" stroke-width="7" marker-end="url(#ah-ox)"/>
    <text x="372" y="13" font-size="13" fill="#0a0a0a">Giro a la izquierda (L)</text>
    <text x="64" y="40" font-size="12" fill="#7a7a7a">Volúmenes = demanda de la hora pico (suma de 4 intervalos de 15 min). Giros a la derecha: libres, no semaforizados.</text>
  </g>
</svg>
